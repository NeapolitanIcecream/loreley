site_name: Loreley
site_description: Automated MAP-Elites system that evolves entire git repositories.

exclude_docs: |
  marketing/README.md
  marketing/2026-08-loreley-launch-claim-sheet.md
  marketing/2026-08-loreley-launch-copy-kit.md
  research/2026-08-03-loreley-promotion-plan.md
  research/2026-08-03-zstandard-third-case-study-handoff.md

theme:
  name: material

nav:
  - Home: index.md
  - Evidence:
      - Three-case-study report: research/2026-08-07-loreley-case-study-evidence-report.md
      - markdown-it-py DeepSeek case study: research/2026-08-02-markdown-it-py-deepseek-case-study.md
      - python-pathspec DeepSeek case study: research/2026-08-03-pathspec-deepseek-case-study.md
      - Zstandard V19 case study: research/2026-08-07-zstandard-gpt-v19-case-study-report.md
      - Zstandard V19 Top-10 supplement: research/2026-08-07-zstandard-gpt-v19-top10-validation-supplement.md
      - Candidate source diffs: marketing/candidates/README.md
      - Framework convergence proposal: research/2026-08-07-case-study-framework-convergence-proposal.md
      - Deferred research register: research/2026-08-07-case-study-deferred-research.md
  - Essays & collaboration:
      - 用编码智能体搜索真实代码仓库: marketing/2026-08-loreley-launch-article-zh.md
      - Searching Real Code Repositories with Coding Agents: marketing/2026-08-loreley-launch-article-en.md
      - Design partners: marketing/loreley-design-partner-brief.md
  - Releases:
      - Unreleased: releases/unreleased.md
      - v0.9.0-alpha: releases/v0.9.0-alpha.md
      - v0.8.4-alpha: releases/v0.8.4-alpha.md
      - v0.8.3-alpha: releases/v0.8.3-alpha.md
      - v0.8.2-alpha: releases/v0.8.2-alpha.md
      - v0.8.1-alpha: releases/v0.8.1-alpha.md
      - v0.8.0-alpha: releases/v0.8.0-alpha.md
      - v0.7.9-alpha: releases/v0.7.9-alpha.md
      - v0.7.8-alpha: releases/v0.7.8-alpha.md
      - v0.7.7-alpha: releases/v0.7.7-alpha.md
  - Loreley:
      - Configuration: loreley/config.md
      - Campaign program: loreley/campaign-program.md
      - Experiments: loreley/core/experiments.md
      - Core contracts: loreley/core/contracts.md
      - Manual seeds: loreley/manual-seeds.md
      - Reliable evaluation methods: loreley/evaluation-methods.md
      - Architecture decisions: adr/index.md
      - Scheduler:
          - Overview: loreley/scheduler/main.md
          - Job scheduling: loreley/scheduler/job_scheduler.md
          - Ingestion: loreley/scheduler/ingestion.md
      - Database:
          - Engine & sessions: loreley/db/base.md
          - Models: loreley/db/models.md
      - MAP-Elites:
          - Overview: loreley/core/map-elites/map-elites.md
          - Repository embeddings: loreley/core/map-elites/repository_embedding.md
          - Preprocessing: loreley/core/map-elites/preprocess.md
          - Chunking: loreley/core/map-elites/chunk.md
          - Code embeddings: loreley/core/map-elites/code_embedding.md
          - Dimensionality reduction: loreley/core/map-elites/dimension_reduction.md
          - Sampler: loreley/core/map-elites/sampler.md
          - Snapshots: loreley/core/map-elites/snapshot.md
      - Worker pipeline:
          - Repository: loreley/core/worker/repository.md
          - Planning: loreley/core/worker/planning.md
          - Agent: loreley/core/worker/agent.md
          - Coding: loreley/core/worker/coding.md
          - Evaluation: loreley/core/worker/evaluator.md
          - Evolution loop: loreley/core/worker/evolution.md
          - Commit cards: loreley/core/worker/commit_card.md
          - Commit summaries: loreley/core/worker/commit_summary.md
          - Artifacts: loreley/core/worker/artifacts.md
          - Job store: loreley/core/worker/job_store.md
      - Tasks:
          - Broker: loreley/tasks/broker.md
          - Workers: loreley/tasks/workers.md
      - UI API: loreley/api.md
      - Agent REST API: loreley/agent-api.md
      - Streamlit UI: loreley/ui.md
  - Operations:
      - Doctor (environment checks): script/doctor.md
      - Status: script/status.md
      - Database schema commands: script/db.md
      - Managing jobs: script/jobs.md
      - Job lease recovery: script/job_leases.md
      - Archive stats: script/archive_stats.md
      - Config dump: script/config_dump.md
      - Benchmarking: script/benchmarks.md
      - Running the scheduler: script/run_scheduler.md
      - Running the worker: script/run_worker.md
      - Running the UI API: script/run_api.md
      - Running the UI: script/run_ui.md
      - Resetting the database: script/reset_db.md

markdown_extensions:
  - admonition
  - codehilite
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
