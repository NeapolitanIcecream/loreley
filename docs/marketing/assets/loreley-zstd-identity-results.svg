<text x="870" y="715.0" fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" text-anchor="start">Median gain: +1.116%</text>
<text x="870" y="752.0" fill="#475569" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" text-anchor="start">Point range: +0.856% to +1.239%</text>
<text x="870" y="785.0" fill="#64748B" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" text-anchor="start">Runner-up fe39bee8: +1.173%</text>
<rect x="80" y="835" width="600" height="42" rx="21" fill="#FFF7E6" stroke="none" stroke-width="2"/><text x="380.0" y="864.0" fill="#B45309" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" text-anchor="middle">Post-selection sensitivity · not a new blinded winner</text>
<text x="1520" y="864.0" fill="#475569" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" text-anchor="end">Fresh-corpus result for fe39bee8: +0.891% (95% CI +0.522% to +1.261%)</text>
