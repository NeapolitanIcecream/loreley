<text x="848" y="328.0" fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" text-anchor="start">distinct release binaries</text>
<rect x="1190" y="220" width="330" height="150" rx="24" fill="#FFF7E6" stroke="none" stroke-width="2"/>
