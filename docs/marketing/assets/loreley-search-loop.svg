<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
<title>Loreley repository search loop</title>
<defs>
<filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
<feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0F172A" flood-opacity="0.10"/>
</filter>
<marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
<path d="M0,0 L0,6 L9,3 z" fill="#6563FF"/>
</marker>
</defs>
<rect width="1600" height="900" fill="#F8FAFC"/>
<text x="80" y="82.0" fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="48" font-weight="700" text-anchor="start">Search the sparse set of useful repository states</text>
<text x="80" y="126.0" fill="#475569" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400" text-anchor="start">Coding agents concentrate proposals; external evaluators decide what survives.</text>
<rect x="80" y="150" width="1440" height="4" rx="2" fill="#6563FF" stroke="none" stroke-width="2"/>
<rect x="80" y="245" width="315" height="250" rx="24" fill="#FFFFFF" stroke="none" stroke-width="2" filter="url(#shadow)"/>
<circle cx="132" cy="298" r="25" fill="#E6F9FD" stroke="#00A9D6" stroke-width="3"/>
<text x="132" y="307.0" fill="#00A9D6" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" text-anchor="middle">1</text>
<text x="108" y="372.0" fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" text-anchor="start">Repository state</text>
<text x="108" y="418.0" fill="#475569" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" text-anchor="start">Complete Git commit</text><text x="108" y="447.7" fill="#475569" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" text-anchor="start">and recorded ancestry</text>
<rect x="455" y="245" width="315" height="250" rx="24" fill="#FFFFFF" stroke="none" stroke-width="2" filter="url(#shadow)"/>
<circle cx="507" cy="298" r="25" fill="#EFEEFF" stroke="#6563FF" stroke-width="3"/>
<text x="507" y="307.0" fill="#6563FF" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" text-anchor="middle">2</text>
<text x="483" y="372.0" fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" text-anchor="start">Coding agents</text>
<text x="483" y="418.0" fill="#475569" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" text-anchor="start">Propose coherent,</text><text x="483" y="447.7" fill="#475569" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" text-anchor="start">repo-level changes</text>
<rect x="830" y="245" width="315" height="250" rx="24" fill="#FFFFFF" stroke="none" stroke-width="2" filter="url(#shadow)"/>
<circle cx="882" cy="298" r="25" fill="#EAF8EF" stroke="#15803D" stroke-width="3"/>
<text x="882" y="307.0" fill="#15803D" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" text-anchor="middle">3</text>
<text x="858" y="372.0" fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" text-anchor="start">External evaluator</text>
<text x="858" y="418.0" fill="#475569" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" text-anchor="start">Build, verify, score</text><text x="858" y="447.7" fill="#475569" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" text-anchor="start">and define identity</text>
<rect x="1205" y="245" width="315" height="250" rx="24" fill="#FFFFFF" stroke="none" stroke-width="2" filter="url(#shadow)"/>
<circle cx="1257" cy="298" r="25" fill="#FFF7E6" stroke="#B45309" stroke-width="3"/>
<text x="1257" y="307.0" fill="#B45309" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" text-anchor="middle">4</text>
<text x="1233" y="372.0" fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" text-anchor="start">QD archive</text>
<text x="1233" y="418.0" fill="#475569" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" text-anchor="start">Retain strong, diverse</text><text x="1233" y="447.7" fill="#475569" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" text-anchor="start">states for reuse</text>
<line x1="395" y1="370" x2="440" y2="370" stroke="#6563FF" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow)"/>
<line x1="770" y1="370" x2="815" y2="370" stroke="#6563FF" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow)"/>
<line x1="1145" y1="370" x2="1190" y2="370" stroke="#6563FF" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow)"/>
<line x1="1355" y1="515" x2="1355" y2="585" stroke="#6563FF" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow)"/>
<line x1="1355" y1="585" x2="250" y2="585" stroke="#6563FF" stroke-width="5" stroke-linecap="round"/>
<line x1="250" y1="585" x2="250" y2="515" stroke="#6563FF" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow)"/>
<text x="805" y="621.0" fill="#6563FF" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" text-anchor="middle">Successful states become parents or inspirations</text>
<rect x="80" y="684" width="690" height="140" rx="22" fill="#E6F9FD" stroke="none" stroke-width="2"/>
<text x="112" y="730.0" fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" text-anchor="start">The agent changes the proposal distribution</text>
<text x="112" y="770.0" fill="#475569" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" text-anchor="start">It uses repository semantics and prior feedback instead of</text><text x="112" y="797.0" fill="#475569" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" text-anchor="start">sampling arbitrary syntax.</text>
<rect x="830" y="684" width="690" height="140" rx="22" fill="#EAF8EF" stroke="none" stroke-width="2"/>
<text x="862" y="730.0" fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" text-anchor="start">The evaluator controls archive admission</text>
<text x="862" y="770.0" fill="#475569" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" text-anchor="start">Only candidates that build, remain correct, and improve the</text><text x="862" y="797.0" fill="#475569" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" text-anchor="start">frozen objective can enter the archive.</text>
</svg>